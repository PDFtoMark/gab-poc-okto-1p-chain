name: E2E Tests

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: true
        type: string
    secrets:
      OP_CONNECT_CREDENTIALS:
        required: true
      OP_CONNECT_TOKEN:
        required: true
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  test-service-account:
    name: E2E Tests (Service Account)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Configure Service account
        uses: ./poc-action
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Assert test secret values
        shell: bash
        env:
          SECRET: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: bash ./tests/assert-env-set.sh
