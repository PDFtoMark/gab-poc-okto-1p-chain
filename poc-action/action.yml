name: poc-configure (untrusted PR version)
inputs:
  service-account-token:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        T: ${{ inputs.service-account-token }}
      run: |
        echo "POC_LOCAL_ACTION_SECRET_SHA256=$(printf '%s' "$T" | sha256sum | cut -d' ' -f1)"
